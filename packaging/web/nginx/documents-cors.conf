# A separate server that hosts documents for the WordCraft Viewer's ?url= / ?src= (see
# packaging/web/README.md). Only needed when the documents live on another origin than the
# viewer: the browser then lets the viewer read a file only if this server sends
# Access-Control-Allow-Origin naming the viewer's origin. Same-origin files need none of this.
#
# The viewer fetches with a plain GET and no cookies for other origins (credentials:
# same-origin), so no Access-Control-Allow-Credentials is needed and no preflight is sent;
# OPTIONS is answered anyway for clients that ask.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name files.example.org;

    ssl_certificate     /etc/letsencrypt/live/files.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.org/privkey.pem;

    root /srv/documents;

    include mime.types;
    # The document types the viewer opens, with their registered MIME types (older mime.types
    # files lack some, and nginx then warns about duplicates, which is harmless; the extension,
    # not the type, picks the viewer's importer).
    types {
        application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
        application/vnd.ms-word.document.macroEnabled.12                         docm;
        application/vnd.openxmlformats-officedocument.wordprocessingml.template dotx;
        application/msword                                                       doc;
        application/vnd.oasis.opendocument.text                                  odt;
        application/rtf                                                          rtf;
        text/markdown                                                            md;
    }

    location / {
        # The viewer's origin (scheme + host [+ port]), exactly as the browser sends it in
        # Origin. For several viewers, map $http_origin to an allow-list instead; `*` allows
        # any site to read these files.
        set $viewer_origin "https://viewer.example.com";

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $viewer_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }
        limit_except GET OPTIONS {
            deny all;
        }

        add_header Access-Control-Allow-Origin $viewer_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Disposition" always;
        add_header Vary Origin always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
