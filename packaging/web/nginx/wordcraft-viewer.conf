# WordCraft Viewer (web) on nginx: a complete server block. See packaging/web/README.md.
#
# Install: unpack wordcraft-web-<version>.zip, point `root` at the unpacked
# wordcraft-web-<version>/ folder (index.html, wordcraft-web-<hash>.js,
# wordcraft-web-<hash>_bg.wasm, fonts/, egui-fonts/ and their .br/.gz copies), set
# server_name and the certificate, then put this file in /etc/nginx/conf.d/ (or
# sites-available/ + a link in sites-enabled/) and run `nginx -t && systemctl reload nginx`.
#
# Brotli: `brotli_static` needs the ngx_brotli static module (Debian/Ubuntu:
# `apt install libnginx-mod-http-brotli-static`, which loads it through modules-enabled/;
# elsewhere `load_module modules/ngx_http_brotli_static_module.so;` at the top of nginx.conf).
# Without the module, delete the `brotli_static` line: `gzip_static` still serves the .gz
# copies, and clients without either get the plain files.

# Plain HTTP only redirects: WebGPU, the clipboard and the browser's save picker need a secure
# context (https://, or http://localhost while testing).
server {
    listen 80;
    listen [::]:80;
    server_name viewer.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name viewer.example.com;

    ssl_certificate     /etc/letsencrypt/live/viewer.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viewer.example.com/privkey.pem;

    root /var/www/wordcraft-viewer;   # the unpacked wordcraft-web-<version>/ folder
    index index.html;

    # MIME types: browsers only stream-compile wasm served as application/wasm, and many
    # mime.types files have no .ttf entry (the fonts would go out as text/plain). Recent
    # mime.types files list wasm already; nginx then warns about a duplicate "wasm" extension,
    # which is harmless.
    include mime.types;
    types {
        application/wasm wasm;
        font/ttf         ttf;
    }
    charset utf-8;
    charset_types text/javascript application/javascript text/plain text/markdown;

    # Precompressed copies made by package.sh (x.br, x.gz next to x): nginx sends them as they
    # are, so it compresses nothing at request time. The URI's own extension still sets the
    # Content-Type, and the rules below match the plain names.
    gzip_static on;
    brotli_static on;   # delete if the brotli module isn't installed (see above)
    # For files without a precompressed copy (licences, the icon):
    gzip on;
    gzip_types application/wasm text/javascript application/javascript font/ttf text/plain;

    # `add_header` in a location replaces the server's, so each location repeats nosniff.
    add_header X-Content-Type-Options nosniff always;

    # index.html (also what / serves): always revalidated, so a new release is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The app and its icon carry a hash in their names (wordcraft-web-0123456789abcdef.js,
    # ..._bg.wasm, wordcraft-0123456789abcdef.ico), and so does the folder of the JS snippets the
    # glue imports (snippets/eframe-0123456789abcdef/inline0.js): a new build gets new names,
    # so they can be cached for good.
    location ~ "^/(wordcraft(-web)?-[0-9a-f]{16}(\.js|_bg\.wasm|\.ico)|snippets/[^/]+-[0-9a-f]{16}/.+\.js)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Fonts fetched after start-up keep their names between releases: one week.
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /egui-fonts/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Anything else (licences, _headers): as it is. There are no client-side routes, so no
    # fallback to index.html; ?url=, ?src=, ?sample and ?webgl are query strings on /.
    # ($uri/ lets `index` turn / into /index.html, which the no-cache rule above then serves.)
    location / {
        try_files $uri $uri/ =404;
    }

    # Serving under a sub-path instead (https://example.com/wordcraft/): every URL in index.html
    # is relative, so the same folder works there. Use this location in the example.com server
    # in place of the ones above (an `alias` folder needs the trailing slashes as shown):
    #
    # location /wordcraft/ {
    #     alias /var/www/wordcraft-viewer/;
    #     index index.html;
    #     gzip_static on;
    #     brotli_static on;
    #     add_header X-Content-Type-Options nosniff always;
    #     location ~ "^/wordcraft/index\.html$" {
    #         add_header Cache-Control "no-cache" always;
    #         add_header X-Content-Type-Options nosniff always;
    #     }
    #     location ~ "^/wordcraft/(wordcraft(-web)?-[0-9a-f]{16}(\.js|_bg\.wasm|\.ico)|snippets/[^/]+-[0-9a-f]{16}/.+\.js)$" {
    #         add_header Cache-Control "public, max-age=31536000, immutable" always;
    #         add_header X-Content-Type-Options nosniff always;
    #     }
    #     location ~ "^/wordcraft/(egui-)?fonts/" {
    #         add_header Cache-Control "public, max-age=604800" always;
    #         add_header X-Content-Type-Options nosniff always;
    #     }
    # }
    # location = /wordcraft { return 301 /wordcraft/$is_args$args; }
}
