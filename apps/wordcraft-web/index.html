<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>WordCraft Viewer</title>
  <link data-trunk rel="icon" href="../../assets/app-icon/wordcraft.ico" />
  <link data-trunk rel="rust" data-bin="wordcraft-web" data-wasm-opt="z"
    data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue --enable-simd"
    data-weak-refs />
  <!-- The bundled document fonts, fetched rather than compiled into the wasm
       (wordcraft_fonts::FETCHED_FILES); preloaded so they download alongside it. -->
  <link data-trunk rel="copy-dir" href="../../assets/fonts" />
  <link rel="preload" href="fonts/SourceSans3-Semibold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="fonts/SourceSans3-Bold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="fonts/SourceSans3-It.ttf" as="fetch" crossorigin>
  <link rel="preload" href="fonts/SourceSerif4-Regular.ttf" as="fetch" crossorigin>
  <link rel="preload" href="fonts/SourceSerif4-It.ttf" as="fetch" crossorigin>
  <link rel="preload" href="fonts/SourceSerif4-Semibold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="fonts/SourceSerif4-Bold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="fonts/SourceSerif4-BoldIt.ttf" as="fetch" crossorigin>
  <link rel="preload" href="fonts/Inter-Medium.ttf" as="fetch" crossorigin>
  <link rel="preload" href="fonts/Inter-SemiBold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="fonts/JetBrainsMono-Regular.ttf" as="fetch" crossorigin>
  <!-- egui's default faces, fetched after the app starts (web::EGUI_FACE_FILES), not preloaded. -->
  <link data-trunk rel="copy-dir" href="assets/egui-fonts" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #wordcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading">Loading WordCraft Viewer&hellip;</div>
</body>
</html>
