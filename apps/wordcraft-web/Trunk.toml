# Build with: trunk build --release --cargo-profile web   (from apps/wordcraft-web)
# `--cargo-profile web` is the small build (Cargo.toml `[profile.web]`, packaging/web/README.md).
[build]
target = "index.html"
dist = "../../dist/web"
public_url = "./"
filehash = true

[serve]
addresses = ["127.0.0.1"]
port = 8771
